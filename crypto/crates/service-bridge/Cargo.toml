[package]
name = "juicebox-messaging-mls-service-bridge"
version = "0.1.0"
description = "Stdio JSONL bridge exposing the frozen-profile MLS core to the service (ADR 0004)"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "jbm-mls-bridge"
path = "src/main.rs"

[dependencies]
juicebox-messaging-client-core = { path = "../client-core" }
openmls = { workspace = true }
openmls_memory_storage = { workspace = true }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }

[lints]
workspace = true
