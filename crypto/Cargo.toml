[workspace]
members = ["crates/client-core", "crates/lab-store", "crates/lab-cli", "crates/service-bridge", "crates/wasm-client"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.91.0"
license = "MIT"

[workspace.dependencies]
openmls = { version = "=0.9.0-rc.2", default-features = false }
openmls_traits = { version = "=0.6.0-rc.2", default-features = false }
openmls_rust_crypto = { version = "=0.6.0-rc.2", default-features = false }
openmls_basic_credential = { version = "=0.6.0-rc.2", default-features = false }
openmls_memory_storage = { version = "=0.6.0-rc.2", default-features = false }
tls_codec = { version = "=0.5.0", default-features = false, features = ["std", "mls"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
debug = 0
lto = true
overflow-checks = true
panic = "abort"
strip = "symbols"

